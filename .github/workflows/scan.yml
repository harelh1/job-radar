name: Job Radar scan

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; each run keeps scanning for ~9 min, so coverage is continuous
  workflow_dispatch: {}

concurrency:
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan careers sites (every ~2 minutes for 9 minutes)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          python scanner/scan.py --loop 540 --git
